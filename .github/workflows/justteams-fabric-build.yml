name: JustTeams Fabric Build

on:
  push:
    branches:
      - JustTeams-Fabric
  pull_request:
    branches:
      - JustTeams-Fabric

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        working-directory: Fabric 1.21.11 foundation
        run: chmod +x gradlew

      - name: Build Fabric mod
        working-directory: Fabric 1.21.11 foundation
        run: ./gradlew build --stacktrace
